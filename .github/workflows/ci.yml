name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The release the Skia archives pinned by binaries.json were built with: see
  # metadata.json in the archives. The build stops if the two differ.
  EMSCRIPTEN_VERSION: 4.0.7

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yarn itself is committed (.yarn/releases, see .yarnrc.yml), so the
      # runner's global yarn just hands over to it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      - run: yarn lint:ci

      - run: yarn tsc

  test:
    name: Build and test
    # The hosted macOS runners have a GPU, through Metal. The Linux ones have
    # none: WebGPU would run on a software driver.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Restore Emscripten
        id: emsdk
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Emscripten
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ~/emsdk/emsdk activate "$EMSCRIPTEN_VERSION"

      - run: echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      # What scripts/skia.ts downloads once and unpacks in the user cache.
      - name: Restore the Skia archives
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/skia-wasm
          key: skia-wasm-${{ runner.os }}-${{ hashFiles('binaries.json') }}

      - run: yarn install --immutable

      - run: yarn playwright install chromium

      - run: yarn test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
