name: Publish

# Releases the package. semantic-release reads the commits since the last
# release and decides the next version from them (fix: a patch, feat: a
# minor), tags it, publishes skia-wasm to npm and creates the GitHub release.
# With no fix nor feat since the last release, it publishes nothing.
#
# There is no npm token. npm trusts this workflow, by its file name, through
# OIDC: see Settings > Trusted Publisher of the package on npmjs.com. Renaming
# this file breaks publishing until that setting names the new file.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run: say what would be released and pack it, publish nothing"
        type: boolean
        default: false

# One release at a time, and never cancelled halfway: the tag is pushed before
# the package is published.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # The release the Skia archives pinned by binaries.json were built with: see
  # metadata.json in the archives. The build stops if the two differ.
  EMSCRIPTEN_VERSION: 4.0.7

jobs:
  publish:
    name: Publish
    if: github.repository == 'wcandillon/skia-wasm' && github.ref_name == 'main'
    # A GitHub-hosted runner: npm does not accept OIDC from self-hosted ones.
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release
      issues: write # comments on the issues a release closes
      pull-requests: write # comments on the pull requests a release ships
      id-token: write # the OIDC token that npm trusts
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the whole history and its tags.
          fetch-depth: 0

      # Node 24 comes with npm 11, the first to publish through OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Restore Emscripten
        id: emsdk
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Install Emscripten
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ~/emsdk/emsdk activate "$EMSCRIPTEN_VERSION"

      - run: echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      # What scripts/skia.ts downloads once and unpacks in the user cache.
      - name: Restore the Skia archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/skia-wasm
          key: skia-wasm-${{ hashFiles('binaries.json') }}

      - run: yarn install --immutable

      # dist/lib is the whole package: the module, its bindings, their types.
      - name: Build
        run: |
          yarn build
          yarn tsc

      - name: Release
        run: yarn release${{ inputs.dry-run && ' --dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Left empty on purpose: publishing authenticates with the OIDC
          # token, and semantic-release-yarn must not look for another.
          YARN_NPM_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          NPM_CONFIG_PROVENANCE: true

      # A dry run leaves the package it would have published as an artifact.
      - name: Pack
        if: inputs.dry-run
        run: |
          yarn pack --out dist/skia-wasm-dry-run.tgz
          tar -tzf dist/skia-wasm-dry-run.tgz

      - uses: actions/upload-artifact@v4
        if: inputs.dry-run
        with:
          name: skia-wasm-dry-run
          path: dist/skia-wasm-dry-run.tgz
          retention-days: 7
